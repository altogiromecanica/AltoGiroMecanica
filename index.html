<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alto Giro Mecânica | Carazinho - RS</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',Arial,sans-serif;background:#f8f9fa;color:#1a1a1a}
h1,h2,h3{font-family:'Montserrat',sans-serif}
.topbar{background:#111;color:#fff;text-align:center;padding:8px;font-size:13px;letter-spacing:1px}
.header{background:#fff;padding:15px 20px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 10px rgba(0,0,0,.08);position:sticky;top:0;z-index:10}
.logo{font-weight:800;font-size:22px}.logo span{color:#ffcc00;background:#111;padding:2px 8px;border-radius:4px}
.hero{position:relative;background:#000}
.hero img{width:100%;height:520px;object-fit:cover;opacity:.85;display:block}
.hero-overlay{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent, rgba(0,0,0,.85));padding:40px 20px;color:#fff}
.hero-overlay h2{font-size:42px;line-height:1.1;color:#ffcc00}
.hero-overlay h2 span{color:#fff;display:block;font-size:24px;font-weight:600;margin-top:8px}
.container{max-width:1100px;margin:auto;padding:25px 15px}
.btn-wa{background:#25D366;color:#fff;padding:16px 32px;border-radius:8px;text-decoration:none;font-weight:800;display:inline-flex;align-items:center;gap:10px;margin-top:15px;box-shadow:0 4px 15px rgba(37,211,102,.3)}
.card-white{background:#fff;border-radius:16px;padding:22px;box-shadow:0 8px 30px rgba(0,0,0,.06);border:1px solid #eee;margin-bottom:25px}
.gallery{display:grid;grid-template-columns:1.2fr .8fr;gap:15px}
.gallery img{width:100%;height:100%;object-fit:cover;border-radius:12px;display:block}
.gallery div{display:grid;gap:15px}
@media(max-width:768px){.gallery{grid-template-columns:1fr}.hero img{height:360px}.hero-overlay h2{font-size:28px}}
.services{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:15px;margin-top:15px}
.svc{background:#111;color:#fff;padding:20px;border-radius:12px;border-left:5px solid #ffcc00}
.svc h3{color:#ffcc00;margin-bottom:6px}
.badge{display:inline-block;background:#ffcc00;color:#000;font-size:11px;font-weight:800;padding:4px 10px;border-radius:20px;margin-bottom:8px}
.map-box iframe{width:100%;height:380px;border:0;border-radius:12px}
.footer{background:#0d0d0d;color:#aaa;text-align:center;padding:30px 15px;margin-top:30px}
</style>
</head>
<body>

<div class="topbar">⚙️ ESPECIALISTA EM LINHA PESADA • CAMINHÕES • TRATORES • MÁQUINAS • CARAZINHO - RS</div>

<div class="header">
<div class="logo">ALTO GIRO <span>MECÂNICA</span></div>
